name: genui_shopping_assistant
description: A Flutter shopping assistant demo using Genkit and GenUI.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  genkit: ^0.12.0
  genkit_google_genai: ^0.2.3
  genui: ^0.7.0
  http: ^1.2.0
  json_schema_builder: ^0.1.3
  logging: ^1.3.0
  schemantic: ^0.1.1


dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
